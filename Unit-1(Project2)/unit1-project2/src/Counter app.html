<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    text-align:center;
    width:350px;
}

h1{
    margin-bottom:20px;
    color:#333;
}

#count{
    font-size:60px;
    margin:20px 0;
    color:blue;
}

button{
    padding:10px 20px;
    margin:10px 5px;
    border:none;
    border-radius:5px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.decrease{
    background:red;
}

.reset{
    background:gray;
}

.increase{
    background:green;
}

button:hover{
    opacity:0.8;
}
</style>

</head>
<body>

<div class="container">
    <h1>Counter App</h1>

    <h2 id="count">0</h2>

    <button class="decrease" onclick="decrease()">- Decrease</button>
    <button class="reset" onclick="resetCounter()">Reset</button>
    <button class="increase" onclick="increase()">+ Increase</button>
</div>

<script>
let count = 0;

function increase(){
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrease(){
    count--;
    document.getElementById("count").innerHTML = count;
}

function resetCounter(){
    count = 0;
    document.getElementById("count").innerHTML = count;
}
</script>

</body>
</html>
